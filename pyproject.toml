[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geneweaver-engine"
version = "0.1.0"
description = "Enterprise GPU-Accelerated CRISPR-Cas9 Off-Target Alignment Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.1.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg2-binary>=2.9.9",
    "redis>=5.1.1",
    "biopython>=1.84"
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.3.0"
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
    "black>=24.10.0",
    "flake8>=7.1.1"
]