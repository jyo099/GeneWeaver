[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geneweaver"
version = "0.1.0"
description = "GPU-Accelerated CRISPR-Cas9 Alignment Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "biopython>=1.83",
    "python-multipart>=0.0.9"
]

# --------------------------------------------------
# Optional dependencies
# --------------------------------------------------

[project.optional-dependencies]

gpu = [
    "cupy-cuda12x"
]

database = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13"
]

cache = [
    "redis>=5.0",
    "celery>=5.4"
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.0",
    "aiosqlite>=0.20"
]

# --------------------------------------------------
# Package discovery
# --------------------------------------------------

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------
# Pytest configuration
# --------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# --------------------------------------------------
# Ruff configuration
# --------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"

# --------------------------------------------------
# Black configuration
# --------------------------------------------------

[tool.black]
line-length = 88